query FetchStoreChannel($id: String!) {
  channel(id: $id) {
    id
    version
    key
    roles
    nameAllLocales {
      locale
      value
    }
    address {
      country
      streetName
      streetNumber
      additionalStreetInfo
      postalCode
      city
      state
      region
      additionalAddressInfo
      company
      apartment
      building
      department
      pOBox
      phone
      mobile
      fax
      email
      firstName
      lastName
      title
      salutation
    }
    geoLocation {
      ... on Point {
        coordinates
      }
    }
    custom {
      customFieldsRaw {
        name
        value
      }
    }
  }
}
